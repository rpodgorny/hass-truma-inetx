name: Validate

on:
  push:
  pull_request:
  schedule:
    # HACS/hassfest requirements drift; catch breakage without a push.
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          # This domain is not in home-assistant/brands (see README), and this
          # is a custom repository rather than a HACS default one.
          ignore: brands

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 tests/test_pairing_rotation.py
      - run: python3 tests/test_no_proxy_issue.py
