name: Validate

on:
  push:
  pull_request:
  schedule:
    # HACS/hassfest requirements drift; catch breakage without a push.
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 tests/test_pairing_rotation.py
      - run: python3 tests/test_pairing_transport_dispatch.py
      - run: python3 tests/test_device_from_bluez.py
      - run: python3 tests/test_no_proxy_issue.py
      - run: python3 tests/test_water_entities.py
      - run: python3 tests/test_energy_entities.py
      # The config flow builds its voluptuous schema at import time, and this
      # test drives the real flow rather than a stub of it.
      - run: pip install voluptuous
      - run: python3 tests/test_panel2_discovery.py
      # The tests that need the protocol library: they build real frames and
      # parse them back rather than trusting a stub to be faithful.
      - run: pip install cbor2==5.6.5
      - run: python3 tests/test_param_discovery.py
      - run: python3 tests/test_measure_request.py
      - run: python3 tests/test_param_meta.py
      - run: python3 tests/test_panel_declared_options.py
